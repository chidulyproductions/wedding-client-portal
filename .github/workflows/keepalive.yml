name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after ~7 days of inactivity, which
# breaks admin/client login with "Failed to fetch" (see ERRORS.md). This pings
# the REST API every 3 days so the inactivity clock never reaches the pause
# threshold. Uses the PUBLIC anon key (same one shipped in the frontend JS),
# stored as a repo secret for tidiness — it is not a privileged credential.

on:
  schedule:
    - cron: "0 9 */3 * *"   # every 3 days at 09:00 UTC — well under the ~7-day pause window
  workflow_dispatch:         # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST to reset inactivity timer
        env:
          SUPABASE_URL: https://lfnlftxqdelcrmbceiob.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # A real query against an existing table counts as project activity.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/clients?select=id&limit=1")
          echo "Supabase REST responded HTTP $code"
          # 2xx = healthy. Anything else (incl. a pause/DNS failure) fails the run so it surfaces.
          case "$code" in
            2*) echo "Keep-alive OK." ;;
            *)  echo "::error::Unexpected status $code - project may be paused or unreachable."; exit 1 ;;
          esac
